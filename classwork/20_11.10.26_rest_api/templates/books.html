<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Библиотекарь</title>
    <style>
        html, body {
            margin: 0;
            padding: 0;
            width: 100%;
            min-height: 100vh;
        }
        body {
            font-family: Arial, sans-serif;
            background: #f5f5f5;
            
            background-image: url('static/bg.webp');
            background-size: cover;       /* Scales image to fill screen */
            background-position: center;  /* Centers the image */
            background-repeat: no-repeat; /* Prevents tiling */
            background-attachment: fixed; /* Keeps image stationary on scroll */
        }
        h1 { color: #333; }
        table { border-collapse: collapse; width: 100%; max-width: 700px; background: #fff; }
        th, td { border: 1px solid #ddd; padding: 10px 15px; text-align: left; }
        th { background: #333; color: #fff; }
        tr:nth-child(even) { background: #f9f9f9; }
        tr:hover { background: #eef; }
        .price { text-align: right; }
    </style>
</head>
<body>
    <nav>
        <a href="/books">Все книги</a>
        <a href="/available">Доступные книги</a>
        <a href="/take-book">Взять книгу</a>
    </nav>
    <h1>Список книг</h1>
    <table>
        <style>
            table { margin: 20px auto;}
        </style>
        <thead>
            <tr>
                <th>ID</th>
                <th>Автор</th>
                <th>Книга</th>
                <th>Доступность</th>
            </tr>
        </thead>
        <tbody>
            {{range .}}
            <tr>
                <td>{{.ID}}</td>
                <td>{{.Author}}</td>
                <td>{{.Title}}</td>
                <td class="avail">{{.Avail}}</td>
            </tr>
            {{end}}
        </tbody>
    </table>
</body>
</html>
