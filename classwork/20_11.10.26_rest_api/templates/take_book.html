<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Библиотекарь</title>
    <style>
        html, body {
            margin: 0;
            padding: 0;
            width: 100%;
            min-height: 100vh;
        }
        body {
            font-family: Arial, sans-serif;
            background: #f5f5f5;
            
            background-image: url('static/bg.webp');
            background-size: cover;       /* Scales image to fill screen */
            background-position: center;  /* Centers the image */
            background-repeat: no-repeat; /* Prevents tiling */
            background-attachment: fixed; /* Keeps image stationary on scroll */
        }
        h1 { color: #333; }
        table { border-collapse: collapse; width: 100%; max-width: 700px; background: #fff; }
        th, td { border: 1px solid #ddd; padding: 10px 15px; text-align: left; }
        th { background: #333; color: #fff; }
        tr:nth-child(even) { background: #f9f9f9; }
        tr:hover { background: #eef; }
        .price { text-align: right; }
    </style>
</head>
<body>
    <h1>Взять книгу</h1>
    <form action="take-book-success" method="POST">
        <select name="book_id">
            {{range .}}
            {{if .Avail}}
            <option name="ID" value="{{.ID}}">{{.ID}} — {{.Author}} — {{.Title}}</option>
            {{end}}
            {{end}}
        </select>
        <button type="submit">Взять</button>
    </form>
    <h2>Все книги</h2>
    <ul>
        {{range .}}
        <li>
            {{.ID}} — {{.Author}} — {{.Title}} —
            {{if .Avail}}доступна{{else}}выдана{{end}}
        </li>
        {{end}}
    </ul>
</body>
</html>
</html>
