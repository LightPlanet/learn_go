<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Библиотекарь</title>
    <style>
        body { font-family: Arial, sans-serif; margin: 40px; background: #f5f5f5; }
        h1 { color: #333; }
        table { border-collapse: collapse; width: 100%; max-width: 700px; background: #fff; }
        th, td { border: 1px solid #ddd; padding: 10px 15px; text-align: left; }
        th { background: #333; color: #fff; }
        tr:nth-child(even) { background: #f9f9f9; }
        tr:hover { background: #eef; }
        .price { text-align: right; }
    </style>
</head>
<body>
    <h1>Поздравляем, вы взяли книгу!</h1>
    <table>
        <thead>
            <tr>
                <th>Автор</th>
                <th>Книга</th>
            </tr>
        </thead>
        <tbody>
            <tr>
                <td>{{.Author}}</td>
                <td>{{.Title}}</td>
            </tr>
        </tbody>
    </table>
    <nav>
        <a href="/books">Вернуться к списоку книг</a>
        <a href="/take-book">Взять ещё</a>
    </nav>
</body>
</html>
